[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system for codebase question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fire>=0.5.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = "^(data|moulinette|openspec|build|dist)/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
